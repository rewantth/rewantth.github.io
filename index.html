<title>rewantth@kali</title>
<style>
:root {
  --bg: #04070c; --panel: rgba(8, 14, 23, .92); --line: #1b2a3f; --blue: #367BF0; --green: #00ff9c;
  --cyan: #00e5ff; --text: #d6e2f0; --dim: #6f8199; --red: #ff4d4d; --yellow: #ffd866; --purple: #b48cff;
}
[data-theme="matrix"] { --blue: #00c46a; --cyan: #7dffb8; --line: #0f3a24; --panel: rgba(2, 12, 7, .92); --text: #c9ffe3; --dim: #4f8f6c; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); overflow: hidden;
  font: 14.5px/1.6 "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", monospace; }
a { color: var(--cyan); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* wallpaper */
.wall { position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: radial-gradient(900px 520px at 80% 86%, rgba(54,123,240,.24), transparent 60%),
              radial-gradient(700px 420px at 10% 6%, rgba(0,255,156,.08), transparent 60%),
              linear-gradient(180deg, #060a11, #02040a); }
.wall::before { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(54,123,240,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(54,123,240,.08) 1px, transparent 1px);
  background-size: 46px 46px; -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 85%); }
.wall .dragon { position: absolute; right: -3%; bottom: -8%; width: min(72vw, 820px); opacity: .10; }
#rain { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
.scan { position: fixed; inset: 0; z-index: 60; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
.vig { position: fixed; inset: 0; z-index: 59; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }

/* top bar */
.bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: rgba(4,8,14,.85); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--green); white-space: nowrap; }
.brand svg { width: 22px; height: 18px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 1px solid transparent; border-radius: 7px; padding: 3px 10px; cursor: pointer; color: var(--dim); white-space: nowrap; }
.tab b { color: var(--dim); font-weight: 400; margin-right: 5px; }
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { color: #04101f; background: var(--blue); border-color: var(--blue); font-weight: 700; }
.tab[aria-current="page"] b { color: #04101f; }
.right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--dim); white-space: nowrap; }
.dots { display: flex; gap: 5px; } .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }

/* window */
.win { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); bottom: 62px; width: min(960px, calc(100vw - 24px)); z-index: 10;
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 24px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(54,123,240,.14), 0 0 70px rgba(54,123,240,.14); }
.title { flex: none; display: flex; align-items: center; height: 38px; padding: 0 14px; background: rgba(13,20,29,.95); border-bottom: 1px solid var(--line); }
.lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.ttl { flex: 1; text-align: center; color: var(--dim); font-size: 13px; padding-right: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term { flex: 1; overflow-y: auto; padding: 16px 20px 8px; scroll-behavior: smooth; }
.term::-webkit-scrollbar { width: 9px; } .term::-webkit-scrollbar-thumb { background: #1b2a3f; border-radius: 6px; }
.hint { flex: none; padding: 7px 20px 10px; color: var(--dim); font-size: 12.5px; border-top: 1px solid var(--line); }
kbd { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font: inherit; font-size: 12px; background: rgba(255,255,255,.03); }

/* terminal text */
.line { white-space: pre-wrap; word-break: break-word; }
.ps1 { white-space: pre; } .ps1 .a { color: var(--blue); } .ps1 .u { color: var(--cyan); font-weight: 700; } .ps1 .p { color: #fff; font-weight: 700; }
.cmd { color: #fff; }
.b { color: var(--blue); } .g { color: var(--green); } .c { color: var(--cyan); } .d { color: var(--dim); } .r { color: var(--red); } .y { color: var(--yellow); } .pu { color: var(--purple); } .w { color: #fff; }
.dir { color: var(--blue); font-weight: 700; } .exe { color: var(--green); }
.lnk { color: var(--cyan); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; }
.lnk:hover { text-decoration-style: solid; }
.gap { height: 10px; }
.inrow { display: flex; align-items: center; }
.inrow .pr { white-space: pre; color: var(--blue); }
#cmd { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff; font: inherit; caret-color: var(--green); padding: 0; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 10px 0; background: rgba(255,255,255,.02); }
.card h3 { margin: 0 0 4px; font-size: 16px; color: #fff; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; font-size: 12px; color: var(--cyan); margin: 2px 4px 2px 0; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 2px 12px; }
.kv .k { color: var(--blue); font-weight: 700; }
.fetch { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
.logo { width: 190px; color: var(--blue); } .logo svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 18px rgba(54,123,240,.6)); }
.swatch { display: flex; margin: 10px 0 4px; } .swatch i { width: 26px; height: 14px; display: block; }
.avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--blue); box-shadow: 0 0 0 4px rgba(54,123,240,.18), 0 0 30px rgba(54,123,240,.5); background: #0b1320; object-fit: cover; display: block; }
.ph { display: flex; gap: 18px; align-items: center; margin: 4px 0 12px; }
.nums { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 8px 0; } .nums div b { display: block; font-size: 22px; color: #fff; }
.nums div span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.heat { display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; max-width: 420px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: #0f1a2a; display: block; }
.repos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.langbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 6px 0; } .langbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--dim); } .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.md h1 { font-size: 20px; color: var(--green); margin: 6px 0 10px; } .md h2 { font-size: 16.5px; color: var(--cyan); margin: 18px 0 6px; } .md h3 { font-size: 15px; color: #fff; margin: 14px 0 4px; }
.md p { margin: 0 0 10px; } .md ul { margin: 0 0 10px; padding-left: 22px; } .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--blue); color: var(--dim); }
.md pre { background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 12px; } .md code { color: var(--yellow); }
.md pre code { color: var(--text); }

/* desktop icons */
.icons { position: fixed; top: 62px; z-index: 8; display: flex; flex-direction: column; gap: 14px; width: 92px; }
.icons.l { left: 14px; } .icons.r { right: 14px; }
.icon { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: 8px; color: var(--text); font-size: 12px; text-shadow: 0 1px 6px #000; }
.icon:hover { background: rgba(54,123,240,.16); }
.icon svg { width: 46px; height: 46px; }
@media (max-width: 1240px) { .icons { display: none; } }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; height: 50px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: rgba(4,8,14,.88); border-top: 1px solid var(--line); }
.launch { width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: rgba(54,123,240,.12); cursor: pointer; display: grid; place-items: center; }
.launch svg { width: 24px; height: 20px; }
.task { border: 1px solid var(--blue); border-radius: 8px; padding: 5px 14px; background: rgba(54,123,240,.14); color: var(--text); cursor: pointer; }
.tray { margin-left: auto; display: flex; gap: 14px; color: var(--dim); font-size: 13px; }

/* launcher + context menu */
.veil { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.5); display: grid; place-items: start center; padding-top: 14vh; }
.veil[hidden], .ctx[hidden] { display: none; }
.launcher { width: min(520px, calc(100vw - 24px)); background: #09111b; border: 1px solid var(--blue); border-radius: 12px; box-shadow: 0 0 60px rgba(54,123,240,.35); overflow: hidden; }
.launcher input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: #fff; font: inherit; padding: 14px 16px; outline: 0; }
.launcher ul { list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow-y: auto; }
.launcher li { padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.launcher li small { color: var(--dim); } .launcher li.sel { background: rgba(54,123,240,.28); }
.ctx { position: fixed; z-index: 90; min-width: 210px; background: #09111b; border: 1px solid var(--line); border-radius: 10px; padding: 5px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
.ctx button:hover { background: rgba(54,123,240,.28); } .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

@media (max-width: 700px) {
  body { font-size: 13.5px; } .brand span { display: none; } .win { top: 50px; bottom: 56px; width: calc(100vw - 12px); border-radius: 10px; }
  .term { padding: 12px 12px 6px; } .fetch { grid-template-columns: 1fr; } .logo { width: 140px; } .tray span:first-child { display: none; }
  .kv { grid-template-columns: 78px 1fr; } .hint { padding: 6px 12px 8px; } .right .dots { display: none; }
}
@media (prefers-reduced-motion: reduce) { .term { scroll-behavior: auto; } #rain { display: none; } }
</style>
</head>

    desc: "The threat model first, then the controls it produced.",
    body: `# A dashboard that can't leak its own data

I wanted a page that shows the state of a mailbox from any device, without the page, the pipeline or the logs ever holding that data in the clear. I wrote the threat model before the code.

## Threats I wrote down

- **Someone reads the mailbox.** The program only gets read-only access, through the \`gmail.readonly\` scope. It cannot send, delete or change anything.
- **Someone downloads the published data.** The page has to be public, so the file is public too. It is encrypted with AES-256-GCM. The key comes from a passphrase through PBKDF2-SHA-256 with 1,000,000 rounds. Each file gets its own random IV, and tampering fails authentication.
- **Someone injects script into the page.** A strict Content Security Policy is generated at build time from the hash of the page's own script. Injected scripts and inline handlers are refused. I tested it by injecting both.
- **A dependency or CI action is hijacked.** Every Action is pinned to an exact commit and every Python package to an exact version. The workflow starts with \`permissions: {}\` and each job asks only for what it needs.
- **The source leaks.** The code lives in a private repository. Only the finished page and the ciphertext are published, using an SSH deploy key that can write to one repository and nothing else.

## What it cannot do

The encrypted file is public, so anyone can try passphrases on their own computer. The 1,000,000 rounds slow that down. They do not stop it. Only a long random passphrase does. That is the honest limit of any static page.

## Tests

\`\`\`
32 of 32  classifier
20 of 20  alerts
25 of 25  security
 8 of 8   cache
\`\`\`

The security suite checks that the policy blocks injection, that a tampered file is rejected, that nothing stores the passphrase, and that every dependency is pinned.` },

    desc: "Remember a user without ever storing their secret.",
    body: `# Keep the key, not the passphrase

A page that asks for a long passphrase every visit is painful on a phone. Storing the passphrase in the browser is worse: anything that can read the storage can read the secret.

## The approach

After the first unlock, the page derives the AES key with \`extractable: false\` and stores that \`CryptoKey\` object in IndexedDB. The browser can use such a key to decrypt, but no code, including the page's own, can read the key material back out.

\`\`\`js
crypto.subtle.deriveKey(
  { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
  base, { name: "AES-GCM", length: 256 },
  false,            // not extractable
  ["decrypt"]
);
\`\`\`

## The trade-off I had to accept

To reuse one stored key for every new file, the salt has to be fixed for the project. It is not secret and it is unique per repository. Every file still gets its own random IV, which is the value that must never repeat.

## A non-extractable key is still usable

If hostile script ran on the same origin it could ask the browser to decrypt with that key. So the key store is only half the defence. The other half is the Content Security Policy that stops hostile script from running at all, and a Lock button that deletes the key.` },
];

document.addEventListener("click", (e) => { if (!e.target.closest("#ctx")) $("ctx").hidden = true; });

/* ---------- start ---------- */
function clock() { const d = new Date(); const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }); const day = d.toLocaleDateString([], { weekday: "short", day: "2-digit", month: "short" }); $("clock").textContent = t + "  " + day; $("clock2").textContent = t; }
buildDesktop(); clock(); setInterval(clock, 20000);
if (loadSetting("theme") === "matrix") document.documentElement.dataset.theme = "matrix";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
toggleRain(!reduce && loadSetting("rain") !== "0");
const first = (location.hash.replace(/^#\//, "") || "home"); go(ROUTES.some((r) => r[0] === first.split("/")[0]) ? first : "home", false);
addEventListener("hashchange", () => { const h = location.hash.replace(/^#\//, ""); if (h && ROUTES.some((r) => r[0] === h.split("/")[0])) go(h, false); });
</script>
</body>
</html>
